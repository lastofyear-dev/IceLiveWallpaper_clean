name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -o IceLiveWallpaper_clean_repository_fixed.zip -d source

      - name: Build APK
        run: |
          PROJECT_DIR=$(find source -type f -name settings.gradle -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IceLiveWallpaper-debug
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
